<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taman Bunga · My Reading Archive</title>
<meta name="theme-color" content="#3D2B3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#F7CAC9; --rose:#E8A0BF; --lavender:#C8A2C8; --sage:#A8C09A;
  --butter:#F4E4A6; --coral:#F4A896; --cream:#FFF8F0;
  --surface:rgba(255,248,240,.07); --surface-2:rgba(255,248,240,.12);
  --border:rgba(255,248,240,.15); --muted:rgba(255,248,240,.62);
  --radius:16px; --shadow:0 18px 44px -20px rgba(45,20,45,.75);
  --font-display:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--cream);background:#3D2B3D;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(244,228,166,.20), transparent 62%),
    radial-gradient(820px 520px at 6% -8%, rgba(247,202,201,.18), transparent 60%),
    radial-gradient(900px 620px at 94% 16%, rgba(232,160,191,.20), transparent 62%),
    radial-gradient(1200px 800px at 50% 118%, rgba(200,162,200,.35), transparent 65%),
    linear-gradient(180deg,#2f2030 0%,#3d2b3d 45%,#2f2030 100%);
}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:40;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(61,43,61,.92),rgba(61,43,61,.62));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.topbar-inner{
  display:flex;align-items:center;gap:14px;
  height:60px;max-width:1000px;margin:0 auto;padding:0 20px;
}
.brand{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  font-family:var(--font-display);font-size:1.1rem;font-weight:600;
}
.brand-mark{
  width:24px;height:24px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%,#FFF8F0,var(--rose) 45%,var(--lavender) 75%,var(--coral));
  box-shadow:0 0 18px rgba(232,160,191,.6);
}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{
  font:inherit;cursor:pointer;border:1px solid transparent;
  border-radius:11px;padding:9px 15px;font-size:.85rem;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:.2s;text-decoration:none;line-height:1.2;
}
.btn-primary{
  background:linear-gradient(135deg,var(--rose),var(--coral));color:#3d2030;
  box-shadow:0 8px 22px -10px rgba(232,160,191,.8);
}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{
  background:var(--surface);color:var(--cream);border-color:var(--border);
}
.btn-ghost:hover{background:var(--surface-2)}

/* Container */
.wrap{max-width:1400px;margin:0 auto;padding:16px 24px 40px}

/* Header */
.garden-header{text-align:center;padding:20px 0 16px}
.garden-header h1{
  font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.1;
  margin-bottom:6px;
}
.garden-header h1 .icon{opacity:.9;margin-right:4px}
.garden-header p{
  color:var(--muted);font-size:.85rem;margin:0;
  max-width:520px;margin-left:auto;margin-right:auto;
}
/* Taman view */
.garden-view{
  border-radius:24px;overflow:hidden;
  border:1px solid var(--border);box-shadow:var(--shadow);
  background:#3d4d2f;position:relative;
}
.grass-field{
  position:relative;aspect-ratio:16 / 10;
  background:
    repeating-linear-gradient(45deg,
      transparent 0px, transparent 6px,
      rgba(255,255,255,.02) 6px, rgba(255,255,255,.02) 7px),
    repeating-linear-gradient(-45deg,
      transparent 0px, transparent 8px,
      rgba(0,0,0,.04) 8px, rgba(0,0,0,.04) 9px),
    radial-gradient(circle at 50% 50%,
      #6b7d4f 0%, #5c6b42 50%, #4a5836 100%);
  overflow:hidden;
}
.grass-field::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,248,240,.06) 0%, transparent 30%),
    radial-gradient(circle at 80% 70%, rgba(255,248,240,.04) 0%, transparent 35%);
}

/* Empty state */
.empty-message{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  color:var(--cream);gap:6px;padding:20px;
}
.empty-message .emoji{font-size:3.2rem;opacity:.8;margin-bottom:10px}
.empty-message p{margin:0;font-size:1rem}
.empty-message .sub{color:var(--muted);font-size:.84rem}

/* Grid bunga */
.garden-grid-top{
  position:absolute;inset:0;
  display:grid;grid-template-columns:repeat(6, 1fr);grid-template-rows:repeat(5, 1fr);
  padding:4% 6%;gap:2%;z-index:2;
}
.garden-slot{
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .25s;
  animation:growFlower .9s cubic-bezier(.2,.8,.3,1) both;
}
.garden-slot.empty{cursor:default;animation:none}
.garden-slot:not(.empty):hover{transform:scale(1.15);z-index:5}
.garden-flower-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  overflow:hidden;
}
.garden-slot svg{
  width:85%;height:85%;max-width:85%;
  flex:0 1 auto;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}
@keyframes growFlower{
  0%   {transform:scale(0) rotate(-30deg);opacity:0}
  60%  {transform:scale(1.15) rotate(5deg);opacity:1}
  100% {transform:scale(1) rotate(0deg);opacity:1}
}
.garden-slot.rare svg{filter:drop-shadow(0 0 6px rgba(200,162,200,.8))}
.garden-slot.legend svg{filter:drop-shadow(0 0 10px rgba(244,228,166,.95))}
.garden-slot.legend{
  animation:growFlower .9s cubic-bezier(.2,.8,.3,1) both,
             legendPulse 2.5s ease-in-out infinite 1s;
}
@keyframes legendPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(244,228,166,.7))}
  50%    {filter:drop-shadow(0 0 14px rgba(244,228,166,1))}
}

/* Footer info */
.garden-footer{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:12px;margin-top:18px;
  color:var(--muted);font-size:.85rem;
}

/* Rarity panel */
.rarity-panel{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
  gap:12px;margin-top:24px;
}
.rarity-card{
  background:linear-gradient(160deg, rgba(255,248,240,.08), rgba(255,248,240,.02));
  border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;text-align:center;position:relative;overflow:hidden;
}
.rarity-card::after{
  content:'';position:absolute;top:-20px;right:-20px;
  width:70px;height:70px;border-radius:50%;opacity:.25;
}
.rarity-card.common::after{background:radial-gradient(circle, #A8C09A, transparent 70%)}
.rarity-card.rare::after  {background:radial-gradient(circle, #C8A2C8, transparent 70%)}
.rarity-card.legend::after{background:radial-gradient(circle, #F4E4A6, transparent 70%)}
.rarity-card .rc-label{
  font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;
}
.rarity-card .rc-count{
  font-family:var(--font-display);font-size:1.8rem;
  line-height:1;margin-bottom:4px;
}
.rarity-card .rc-percent{font-size:.72rem;color:var(--muted)}
.rarity-card.common .rc-count{color:#A8C09A}
.rarity-card.rare .rc-count  {color:#C8A2C8}
.rarity-card.legend .rc-count{color:#F4E4A6}

/* Drop rate info */
.drop-rate-info{
  margin-top:20px;padding:16px 18px;
  background:rgba(255,248,240,.04);border:1px solid var(--border);
  border-radius:14px;font-size:.82rem;color:var(--muted);line-height:1.7;
}
.drop-rate-info strong{color:var(--cream)}
.drop-rate-info .rate-row{display:flex;justify-content:space-between;padding:4px 0}
.drop-rate-info .rate-row span:first-child{color:var(--cream)}

/* Loading / auth */
.state-box{
  max-width:420px;margin:12vh auto;padding:32px;border-radius:22px;
  background:linear-gradient(165deg, rgba(255,248,240,.10), rgba(255,248,240,.03));
  border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;
}
.state-box h1{font-size:1.7rem;margin-bottom:8px}
.state-box p{color:var(--muted);font-size:.88rem;margin:0 0 20px;line-height:1.6}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,248,240,.15);
  border-top-color:var(--rose);
  margin:0 auto 12px;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 💀 Efek Secret — Bunga Bangkai */
.garden-slot.secret svg{
  filter:drop-shadow(0 0 10px rgba(40,40,40,.95))
         drop-shadow(0 0 20px rgba(80,60,80,.6));
}
.garden-slot.secret{
  animation:growFlower .9s cubic-bezier(.2,.8,.3,1) both,
             secretPulse 3s ease-in-out infinite 1s,
             secretShake 6s ease-in-out infinite;
}
@keyframes secretPulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(40,40,40,.8))}
  50%    {filter:drop-shadow(0 0 18px rgba(80,60,80,.95))}
}
@keyframes secretShake{
  0%,100%{transform:rotate(0deg)}
  50%    {transform:rotate(-2deg)}
}
.garden-slot.secret::before{
  content:'';position:absolute;inset:-10%;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 20% 30%, rgba(180,180,180,.35) 0%, transparent 8%),
    radial-gradient(circle at 70% 60%, rgba(120,120,120,.30) 0%, transparent 6%),
    radial-gradient(circle at 40% 80%, rgba(200,200,200,.28) 0%, transparent 7%),
    radial-gradient(circle at 80% 20%, rgba(140,140,140,.30) 0%, transparent 5%);
  animation:ashFloat 5s ease-in-out infinite;
}
@keyframes ashFloat{
  0%,100%{transform:translateY(0) scale(1); opacity:.6}
  50%    {transform:translateY(-8px) scale(1.05); opacity:.9}
}

/* 🌹 Efek Legend */
.garden-slot.legend svg{
  filter:drop-shadow(0 0 8px rgba(244,228,166,.9))
         drop-shadow(0 0 16px rgba(233,180,76,.5));
}
.garden-slot.legend{
  animation:growFlower .9s cubic-bezier(.2,.8,.3,1) both,
             legendPulse 2.5s ease-in-out infinite 1s;
}
@keyframes legendPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(244,228,166,.7))}
  50%    {filter:drop-shadow(0 0 16px rgba(244,228,166,1))}
}
.garden-slot.legend::after{
  content:'✦';position:absolute;top:-4px;right:4px;
  font-size:12px;color:#F4E4A6;
  text-shadow:0 0 8px rgba(244,228,166,.9);
  animation:sparkle 2.5s ease-in-out infinite;pointer-events:none;
}
@keyframes sparkle{
  0%,100%{opacity:0; transform:scale(.5) rotate(0deg)}
  50%    {opacity:1; transform:scale(1.2) rotate(180deg)}
}
.garden-slot.secret::after{
  content:'✦';position:absolute;top:-6px;left:50%;
  transform:translateX(-50%);font-size:14px;color:#B8B8B8;
  text-shadow:0 0 10px rgba(180,180,180,.9), 0 0 20px rgba(80,60,80,.7);
  animation:secretSparkle 3s ease-in-out infinite;pointer-events:none;
}
@keyframes secretSparkle{
  0%,100%{opacity:0; transform:translateX(-50%) scale(.5)}
  50%    {opacity:1; transform:translateX(-50%) scale(1.3)}
}

/* 🌸 Popup Detail Bunga */
.flower-detail-backdrop{
  position:fixed;inset:0;z-index:110;
  background:rgba(20,10,20,.82);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .22s;
}
.flower-detail-backdrop.open{opacity:1;pointer-events:auto}
.flower-detail{
  width:100%;max-width:320px;border-radius:22px;padding:22px 20px 24px;
  background:linear-gradient(165deg,#4a3348,#2a1e2a 75%);
  border:1px solid var(--border);
  box-shadow:0 30px 80px -25px #000, 0 0 40px -10px rgba(232,160,191,.25);
  text-align:center;position:relative;
  transform:translateY(14px) scale(.94);
  transition:transform .28s cubic-bezier(.2,.8,.3,1);
}
.flower-detail-backdrop.open .flower-detail{transform:none}
.flower-detail-close{
  position:absolute;top:10px;right:10px;
  background:transparent;border:none;color:var(--muted);
  font-size:1.1rem;cursor:pointer;width:32px;height:32px;
  border-radius:10px;transition:.2s;
}
.flower-detail-close:hover{background:var(--surface);color:var(--cream)}
.flower-detail-visual{
  width:130px;height:130px;margin:4px auto 14px;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.flower-detail-visual svg{
  width:100%;height:100%;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));
}
.flower-detail-visual.rare svg{
  filter:drop-shadow(0 0 8px rgba(200,162,200,.9))
         drop-shadow(0 6px 12px rgba(0,0,0,.5));
}
.flower-detail-visual.legend svg{
  filter:drop-shadow(0 0 10px rgba(244,228,166,.95))
         drop-shadow(0 6px 12px rgba(0,0,0,.5));
}
.flower-detail-visual.legend::after{
  content:'✦';position:absolute;top:6px;right:12px;
  font-size:14px;color:#F4E4A6;
  text-shadow:0 0 8px rgba(244,228,166,.9);
  animation:sparkle 2.5s ease-in-out infinite;pointer-events:none;
}
.flower-detail-visual.secret svg{
  filter:drop-shadow(0 0 10px rgba(40,40,40,.95))
         drop-shadow(0 0 20px rgba(80,60,80,.6))
         drop-shadow(0 6px 12px rgba(0,0,0,.5));
}
.flower-detail-visual.secret::after{
  content:'✦';position:absolute;top:6px;right:12px;
  font-size:14px;color:#B8B8B8;
  text-shadow:0 0 10px rgba(180,180,180,.9);
  animation:secretSparkle 3s ease-in-out infinite;pointer-events:none;
}
.flower-detail-name{
  font-family:var(--font-display);font-size:1.5rem;
  margin:0 0 4px;color:var(--cream);
}
.flower-detail-rarity{
  display:inline-block;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;padding:4px 10px;border-radius:20px;
  margin-bottom:10px;font-weight:500;
}
.flower-detail-rarity.common{
  background:rgba(168,192,154,.22);color:#c4d8b8;
  border:1px solid rgba(168,192,154,.4);
}
.flower-detail-rarity.rare{
  background:rgba(200,162,200,.22);color:#e0c8e0;
  border:1px solid rgba(200,162,200,.45);
}
.flower-detail-rarity.legend{
  background:rgba(244,228,166,.22);color:#f8ecc4;
  border:1px solid rgba(244,228,166,.5);
}
.flower-detail-rarity.secret{
  background:linear-gradient(135deg,rgba(80,80,80,.5),rgba(40,40,40,.7));
  color:#d4d4d4;border:1px solid rgba(180,180,180,.5);
  box-shadow:0 0 14px -2px rgba(180,180,180,.4);
}
.flower-detail-desc{
  font-size:.82rem;color:var(--muted);line-height:1.6;
  margin:8px 0 14px;font-style:italic;
}
.flower-detail-rate{
  font-family:var(--font-display);font-size:1rem;color:var(--rose);
}
.flower-detail-rate strong{font-size:1.3rem;color:var(--cream)}
@media (max-width:600px){
  .flower-detail{max-width:280px;padding:20px 16px 22px}
  .flower-detail-visual{width:110px;height:110px}
  .flower-detail-name{font-size:1.3rem}
}
  /* 📊 Tombol & Popup Lihat Rate */
.rate-trigger-wrap{
  display:flex;
  justify-content:center;
  gap: 16px; /* 👈 Memberikan jarak antar tombol */
  margin-top:20px;
  flex-wrap: wrap;
}
.rate-trigger{
  font:inherit;cursor:pointer;border:1px solid var(--border);
  background:linear-gradient(135deg, rgba(232,160,191,.18), rgba(244,168,150,.12));
  color:var(--cream);border-radius:12px;padding:11px 22px;
  font-size:.88rem;font-weight:500;display:inline-flex;
  align-items:center;gap:8px;transition:.2s;
}
.rate-trigger:hover{
  background:linear-gradient(135deg, rgba(232,160,191,.28), rgba(244,168,150,.20));
  transform:translateY(-1px);
  box-shadow:0 10px 22px -12px rgba(232,160,191,.6);
}
.rate-popup-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(30,18,30,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;
}
.rate-popup-backdrop.open{opacity:1;pointer-events:auto}
.rate-popup{
  width:100%;max-width:420px;border-radius:20px;padding:24px;
  background:linear-gradient(165deg,#4a3348,#33202f 70%);
  border:1px solid var(--border);
  box-shadow:0 40px 90px -30px #000;
  transform:translateY(14px) scale(.98);
  transition:transform .25s cubic-bezier(.2,.8,.3,1);
}
.rate-popup-backdrop.open .rate-popup{transform:none}
.rate-popup-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
}
.rate-popup-head h3{
  font-family:var(--font-display);font-size:1.4rem;
  margin:0;
}
.rate-popup-close{
  background:transparent;border:none;color:var(--muted);
  font-size:1.2rem;cursor:pointer;width:34px;height:34px;
  border-radius:10px;transition:.2s;
}
.rate-popup-close:hover{background:var(--surface);color:var(--cream)}
.rate-list{display:flex;flex-direction:column;gap:2px}
.rate-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 8px;border-bottom:1px solid rgba(255,248,240,.08);
  border-radius:8px;cursor:pointer;transition:.2s;
}
.rate-item:hover{
  background:rgba(255,248,240,.06);
  padding-left:12px;padding-right:12px;
}
.rate-item:last-child{border-bottom:none}
.rate-item .ri-name{
  display:flex;align-items:center;gap:10px;
  font-size:.88rem;color:var(--cream);
}
.rate-item .ri-icon{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;
}
.rate-item .ri-icon.common{background:rgba(168,192,154,.25)}
.rate-item .ri-icon.rare{background:rgba(200,162,200,.25)}
.rate-item .ri-icon.legend{background:rgba(244,228,166,.30)}
.rate-item .ri-pct{
  font-family:var(--font-display);font-size:1rem;
  color:var(--rose);font-weight:600;
}
.rate-item.rare .ri-pct{color:var(--lavender)}
.rate-item.legend .ri-pct{color:var(--butter)}
.rate-popup-note{
  margin-top:14px;font-size:.75rem;color:var(--muted);
  line-height:1.6;text-align:center;
}
@media (max-width:600px){
  .rate-popup{padding:20px;border-radius:16px}
  .rate-popup-head h3{font-size:1.2rem}
  .rate-item .ri-name{font-size:.82rem}
}
  /* 🌸 Tombol Koleksi Bunga */
.collection-trigger{
  font:inherit;cursor:pointer;border:1px solid var(--border);
  background:linear-gradient(135deg, rgba(168,192,154,.20), rgba(244,228,166,.10));
  color:var(--cream);border-radius:12px;padding:11px 22px;
  font-size:.88rem;font-weight:500;display:inline-flex;
  align-items:center;gap:8px;transition:.2s;
}
.collection-trigger:hover{
  background:linear-gradient(135deg, rgba(168,192,154,.30), rgba(244,228,166,.18));
  transform:translateY(-1px);
  box-shadow:0 10px 22px -12px rgba(168,192,154,.7);
}

/* Popup Koleksi */
.collection-popup-backdrop{
  position:fixed;inset:0;z-index:105;
  background:rgba(25,15,25,.82);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;
}
.collection-popup-backdrop.open{opacity:1;pointer-events:auto}
.collection-popup{
  width:100%;max-width:520px;max-height:85vh;overflow-y:auto;
  border-radius:22px;padding:24px;
  background:linear-gradient(165deg,#4a3348,#2a1e2a 75%);
  border:1px solid var(--border);
  box-shadow:0 40px 90px -30px #000, 0 0 50px -15px rgba(232,160,191,.3);
  transform:translateY(14px) scale(.96);
  transition:transform .28s cubic-bezier(.2,.8,.3,1);
}

function flowerForBook(book) {
  // 👇 Variabel baseSeed yang sempat hilang sudah dikembalikan di sini
  const baseSeed = Array.from(book.title || 'X').reduce((a, c) => a + c.charCodeAt(0), 0);
  
  const rarityRoll = (baseSeed * 7) % 100;
  let pickedRarity;
  if (rarityRoll < 60)       pickedRarity = 'common';
  else if (rarityRoll < 80)  pickedRarity = 'rare';
  else if (rarityRoll < 90)  pickedRarity = 'legend';
  else if (rarityRoll < 97)  pickedRarity = 'mythic';
  else                       pickedRarity = 'secret';

  const pool = RARITY_POOL[pickedRarity];
  const flowerRoll = (baseSeed * 13) % pool.length;
  const baseFlower = FLOWER_TYPES.find(f => f.name === pool[flowerRoll]) || FLOWER_TYPES[0];

  // Jika yang keluar adalah Kamboja, acak variannya
  if (baseFlower.name === 'Kamboja' && baseFlower.variants) {
    const variantRoll = (baseSeed * 17) % baseFlower.variants.length;
    const selectedVariant = baseFlower.variants[variantRoll];
    
    return {
      ...baseFlower,
      name: selectedVariant.name,
      color: selectedVariant.color,
      accent: selectedVariant.accent
    };
  }

  return baseFlower;
}

function renderGarden(books, seeds = []) {
  window.__gardenSeeds = seeds;
  window.__gardenBooks = books;

  // Pisahkan seed
  const plantedSeeds = seeds.filter(s => s.status === 'planted');
  const unopenedSeeds = seeds.filter(s => s.status === 'unopened');

  // 1. Render Kotak Seed Pack
  const seedContainer = document.getElementById('seed-container');

    if (unopenedSeeds.length === 0) {
      seedContainer.innerHTML = ''; 
    } else {
      let seedsHTML = '<div style="margin-top:24px;text-align:center;">'
        + '<h3 style="font-family:var(--font-display);font-size:1.2rem;color:var(--cream);margin-bottom:12px;">'
        + '🎁 Seed Pack Tersedia (' + unopenedSeeds.length + ')</h3>'
        + '<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;">';
        
      unopenedSeeds.forEach(seed => {
        seedsHTML += '<button class="rate-trigger" style="padding:16px 24px;font-size:1rem;flex-direction:column;gap:6px;" '
          + 'onclick="openSeedGacha(\'' + seed.id + '\', \'' + esc(seed.book_title) + '\')">'
          + '<span style="font-size:2rem;">🌱</span>'
          + '<span style="font-size:0.7rem;color:var(--muted);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'
          + esc(seed.book_title) + '</span>'
          + '</button>';
      });
      seedsHTML += '</div></div>';
      seedContainer.innerHTML = seedsHTML;
    }
  }

  // 2. Render Taman
  const total = plantedSeeds.length;
  const root = document.getElementById('garden-root');

  if (!total) {
    root.innerHTML = '<div class="garden-view"><div class="grass-field">'
      + '<div class="empty-message"><div class="emoji">🌱</div>'
      + '<p>Padang ini masih kosong.</p>'
      + '<p class="sub">Selesaikan buku pertamamu untuk menumbuhkan bunga.</p>'
      + '</div></div></div>'
      + '<div class="garden-footer"><span>0 bunga tumbuh</span></div>';
    return;
  }

   const flowers = plantedSeeds.map((seed, idx) => {
    const originalBook = books.find(b => b.id === seed.book_id) || { id: seed.book_id, title: seed.book_title };
    const t = FLOWER_TYPES.find(f => f.name === seed.flower_name) || FLOWER_TYPES[0];
    // Penempatan berurutan (slot 0, 1, 2, dst)
    const col = idx % 6; 
    const row = Math.floor(idx / 6);
    return { book: originalBook, flower: t, col, row, seedId: seed.id, has_reset: seed.has_reset };
  });
  const COLS = 6, ROWS = 5;
  const slots = Array.from({ length: COLS * ROWS }, () => null);
  flowers.forEach(f => {
    const idx = f.row * COLS + f.col;
    if (!slots[idx]) slots[idx] = f;
  });

  let slotsHTML = '';
  slots.forEach(f => {
    if (!f) { slotsHTML += '<div class="garden-slot empty"></div>'; return; }
    const t = f.flower;
    slotsHTML += '<div class="garden-slot ' + t.rarity + '" data-book-id="' + f.book.id + '" data-seed-id="' + f.seedId + '" data-has-reset="' + f.has_reset + '" '
      + 'title="' + esc(f.book.title) + ' · ' + t.name + ' (' + t.rarity + ')">'
      + '<div class="garden-flower-wrap">'
      + flowerTopView(t)
      + '<span class="garden-flower-name">' + esc(t.name) + '</span>'
      + '</div>'
      + '</div>';
  });

  root.innerHTML = '<div class="garden-view"><div class="grass-field">'
        + '<div class="grass-layer"></div>' /* 👈 Tambahkan baris ini */
    + '<div class="garden-grid-top">' + slotsHTML + '</div>'

  root.querySelectorAll('.garden-slot[data-book-id]').forEach(el => {

async function openSeedGacha(seedId, bookTitle) {
  const existing = document.getElementById('gachaPopup');
  if (existing) existing.remove();

  const popupHTML =
    '<div class="gacha-popup-backdrop" id="gachaPopup">'
    + '<div class="gacha-popup">'
    + '<div class="gacha-box" id="gachaBox"></div>'
    + '<div class="gacha-result" id="gachaResult"></div>'
    + '<h3 class="gacha-title" id="gachaTitle">Membuka...</h3>'
    + '<div class="gacha-rarity" id="gachaRarity"></div>'
    + '<button class="btn-gacha-close" id="gachaClose" style="display:none" '
    + 'onclick="closeGachaAndReload()">Tanam di Taman</button>'
    + '</div>'
    + '</div>';

  document.body.insertAdjacentHTML('beforeend', popupHTML);
  const popup = document.getElementById('gachaPopup');
  const box = document.getElementById('gachaBox');
  const res = document.getElementById('gachaResult');
  const title = document.getElementById('gachaTitle');
  const rarity = document.getElementById('gachaRarity');
  const closeBtn = document.getElementById('gachaClose');

  requestAnimationFrame(() => popup.classList.add('open'));
  box.classList.add('shake');

  try {
    // 1. Tentukan hasil gacha di memori
    const gachaResult = flowerForBook({ title: bookTitle });

    // 2. Update database
    const { error } = await supabase.from('seeds').update({
      status: 'planted',
      rarity: gachaResult.rarity,
      flower_name: gachaResult.name,
      opened_at: new Date().toISOString()
    }).eq('id', seedId);

    if (error) throw error;

    // 3. Tampilkan hasil
    setTimeout(() => {
      box.classList.remove('shake');
      box.style.display = 'none';
      
      res.innerHTML = flowerTopView(gachaResult);
      title.textContent = gachaResult.name;
      rarity.textContent = gachaResult.rarity;
      rarity.className = 'gacha-rarity ' + gachaResult.rarity;
      
      res.classList.add('show');
      title.classList.add('show');
      rarity.classList.add('show');
      closeBtn.style.display = 'block';
    }, 1500);

  } catch (err) {
    console.error('Error gacha:', err);
    // Jika error, tetap tampilkan hasil gacha secara lokal (fallback)
    const gachaResult = flowerForBook({ title: bookTitle });
    box.classList.remove('shake');
    box.style.display = 'none';
    res.innerHTML = flowerTopView(gachaResult);
    title.textContent = gachaResult.name;
    rarity.textContent = gachaResult.rarity;
    rarity.className = 'gacha-rarity ' + gachaResult.rarity;
    res.classList.add('show');
    title.classList.add('show');
    rarity.classList.add('show');
    closeBtn.style.display = 'block';
  }
}
function closeGachaAndReload() {
  const popup = document.getElementById('gachaPopup');
  if (popup) popup.remove();
  location.reload();
}

function openFlowerDetail(flower, seedId = null, hasReset = false) {
  const existing = document.getElementById('flowerDetail');
  if (existing) existing.remove();

  // Logika untuk Bunga yang punya varian (Kamboja)
  let variants = null;
  let currentIdx = 0;
  
  if (flower.name.includes('Kamboja')) {
    const parent = FLOWER_TYPES.find(f => f.name === 'Kamboja');
    if (parent && parent.variants) {
      variants = parent.variants;
      currentIdx = variants.findIndex(v => v.name === flower.name);
      if (currentIdx === -1) currentIdx = 0;
    }
  }

  const icon = flower.rarity === 'secret' ? '🌺'
            : flower.rarity === 'legend' ? (flower.name === 'Blue Rose' ? '🌹' : '👑')
            : flower.rarity === 'rare'   ? '💜'
            : (flower.name === 'Daisy' ? '🌼' : flower.name === 'Mawar' ? '🌸' : '🌻');

  let svgHTML = (typeof flowerTopView === 'function') ? flowerTopView(flower) : '<div style="font-size:4rem">' + icon + '</div>';

  // Bungkus gambar dalam container dengan ukuran TETAP (130px)
  let visualContent = '<div id="variantImageContainer" style="width:130px; height:130px; transition:opacity 0.2s;">' + svgHTML + '</div>';
  
  // Tambahkan panah kiri kanan secara absolut (melayang di luar gambar)
  if (variants) {
    visualContent = '<div style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">'
      + '<button id="prevVariant" style="position:absolute; left:10px; font-size:2rem; color:var(--muted); background:none; border:none; cursor:pointer; z-index:10;">◀</button>'
      + visualContent
      + '<button id="nextVariant" style="position:absolute; right:10px; font-size:2rem; color:var(--muted); background:none; border:none; cursor:pointer; z-index:10;">▶</button>'
      + '</div>';
  }

  const popupHTML =
    '<div class="flower-detail-backdrop" id="flowerDetail">'
    + '<div class="flower-detail">'
    + '<button class="flower-detail-close" id="flowerDetailClose">✕</button>'
    + '<div class="flower-detail-visual ' + flower.rarity + '">' + visualContent + '</div>'
    + '<h3 class="flower-detail-name" id="detailName">' + flower.name + '</h3>'
    + '<span class="flower-detail-rarity ' + flower.rarity + '">' + flower.rarity + '</span>'
    + '<p class="flower-detail-desc" id="detailDesc">' + (flower.desc || 'Bunga misterius dari tamanmu.') + '</p>'
    + '<div class="flower-detail-rate">Peluang: <strong>' + flower.rate + '%</strong></div>'
    + (seedId && !hasReset ? '<button class="btn-gacha-close" style="margin-top:16px;background:rgba(232,160,191,.1);border-color:rgba(232,160,191,.3);color:#ffd9e6;" onclick="resetToSeed(\'' + seedId + '\')">🔄 Kembalikan ke Seed (1x)</button>' : '')
    + (seedId && hasReset ? '<div style="margin-top:16px;font-size:0.75rem;color:var(--muted);font-style:italic;">Kesempatan reset sudah digunakan.</div>' : '')
    + '</div>'
    + '</div>';

  document.body.insertAdjacentHTML('beforeend', popupHTML);
  const popup = document.getElementById('flowerDetail');
  requestAnimationFrame(() => popup.classList.add('open'));

  document.getElementById('flowerDetailClose').addEventListener('click', closeFlowerDetail);
  popup.addEventListener('click', e => {
    if (e.target.id === 'flowerDetail') closeFlowerDetail();
  });

  // Logika klik panah
  if (variants) {
    const imgContainer = document.getElementById('variantImageContainer');
    const nameEl = document.getElementById('detailName');
    
    const updateVariant = (newIdx) => {
      imgContainer.style.opacity = '0';
      nameEl.style.opacity = '0';
      
      setTimeout(() => {
        const v = variants[newIdx];
        const newFlower = { ...flower, name: v.name, color: v.color, accent: v.accent };
        
        imgContainer.innerHTML = flowerTopView(newFlower);
        nameEl.textContent = v.name;
        
        imgContainer.style.opacity = '1';
        nameEl.style.opacity = '1';
        currentIdx = newIdx;
      }, 200);
    };

    document.getElementById('prevVariant').addEventListener('click', () => {
      const next = (currentIdx - 1 + variants.length) % variants.length;
      updateVariant(next);
    });

    document.getElementById('nextVariant').addEventListener('click', () => {
      const next = (currentIdx + 1) % variants.length;
      updateVariant(next);
    });
  }
}
async function resetToSeed(seedId) {
  if (!confirm('Yakin ingin mengembalikan bunga ini menjadi Seed? Kesempatan ini hanya bisa dilakukan 1x.')) return;

  try {
    const { error } = await supabase.from('seeds').update({
      status: 'unopened',
      rarity: null,
      flower_name: null,
      opened_at: null,
      has_reset: true
    }).eq('id', seedId);

    if (error) throw error;
    closeFlowerDetail();
    location.reload();
  } catch (err) {
    alert('Gagal reset: ' + err.message);
  }
}

function closeFlowerDetail() {
  const popup = document.getElementById('flowerDetail');
  if (!popup) return;
  popup.classList.remove('open');
  setTimeout(() => popup.remove(), 250);
}

function openCollectionPopup() {
  const existing = document.getElementById('collectionPopup');
  if (existing) return;

  // Ambil data seed yang sudah ditanam dari variabel global
  const planted = (window.__gardenSeeds || []).filter(s => s.status === 'planted');
  const total = planted.length;

  // Hitung per rarity
   const rarityCount = { common: 0, rare: 0, legend: 0, mythic: 0, secret: 0 };
  planted.forEach(seed => {
    const t = FLOWER_TYPES.find(f => f.name === seed.flower_name);
    if (t) rarityCount[t.rarity] = (rarityCount[t.rarity] || 0) + 1;
  });

  const pct = n => total ? Math.round((n / total) * 100) : 0;

  const rarityLabels = {
    common: { icon: '🌼', label: 'Common',  color: '#A8C09A' },
    rare:   { icon: '💜', label: 'Rare',    color: '#C8A2C8' },
    legend: { icon: '👑', label: 'Legend',  color: '#F4E4A6' },
        mythic: { icon: '🪷', label: 'Mythic',  color: '#F8BBD0' },
    secret: { icon: '🌺', label: 'Secret',  color: '#B8B8B8' }
  };

    const rarityRows = ['common', 'rare', 'legend', 'mythic', 'secret'].map(r => {
    const info = rarityLabels[r];
    const count = rarityCount[r] || 0;
    const p = pct(count);
    return '<div class="collection-rarity-item ' + r + '">'
      + '<div class="cri-icon">' + info.icon + '</div>'
      + '<div class="cri-info">'
      + '<div class="cri-name">' + info.label + '</div>'
      + '<div class="cri-bar"><i style="width:' + p + '%"></i></div>'
      + '</div>'
      + '<div class="cri-count">' + count + '</div>'
      + '<div class="cri-pct">' + p + '%</div>'
      + '</div>';
  }).join('');

  const popupHTML =
    '<div class="collection-popup-backdrop" id="collectionPopup">'
    + '<div class="collection-popup">'
    + '<div class="collection-head">'
    + '<h3>🌸 Koleksi Bunga</h3>'
    + '<button class="collection-close" id="collectionClose">✕</button>'
    + '</div>'
    + '<div class="collection-total">'
    + '<div class="ct-label">Total Bunga Dimiliki</div>'
    + '<div class="ct-value">' + total + '</div>'
    + '<div class="ct-sub">bunga telah tumbuh di tamanmu</div>'
    + '</div>'
    + '<div class="collection-rarity-list">' + rarityRows + '</div>'
    + '<div class="collection-note">'
    + 'Kumpulkan semua rarity — termasuk Secret yang sangat langka (2%)!'
    + '</div>'
    + '</div>'
    + '</div>';

  document.body.insertAdjacentHTML('beforeend', popupHTML);
  const popup = document.getElementById('collectionPopup');
  requestAnimationFrame(() => popup.classList.add('open'));

  document.getElementById('collectionClose').addEventListener('click', closeCollectionPopup);
  popup.addEventListener('click', e => {
    if (e.target.id === 'collectionPopup') closeCollectionPopup();
  });
}

function closeCollectionPopup() {
  const popup = document.getElementById('collectionPopup');
  if (!popup) return;
  popup.classList.remove('open');
  setTimeout(() => popup.remove(), 250);
}

function openRatePopup() {
  const existing = document.getElementById('ratePopup');
  if (existing) return;

   const rarityLabels = {
    common: { icon: '🌼', label: 'Common' },
    rare:   { icon: '💜', label: 'Rare' },
    legend: { icon: '👑', label: 'Legend' },
    mythic: { icon: '🪷', label: 'Mythic' }, // 👈 Tambah ini
    secret: { icon: '🌺', label: 'Secret' }
  };

  const rarityGroups = ['common', 'rare', 'legend', 'mythic', 'secret'].map(r => { // 👈 Tambah 'mythic'
    // ...
    const info = rarityLabels[r];
    const pool = RARITY_POOL[r];
    const perFlower = (100 / pool.length).toFixed(2);

    const flowersHTML = pool.map(name => {
      const icon = r === 'secret' ? '🌺' : r === 'legend' ? (name === 'Blue Rose' ? '🌹' : '👑') : r === 'rare' ? '💜' : (name === 'Daisy' ? '🌼' : name === 'Mawar' ? '🌸' : '🌻');
      return '<div class="rate-item ' + r + '" data-flower-name="' + name + '">'
        + '<div class="ri-name"><span class="ri-icon ' + r + '">' + icon + '</span> ' + name + '</div>'
        + '<div class="ri-pct">' + perFlower + '%</div>'
        + '</div>';
    }).join('');

    return '<div class="rate-rarity-group" data-rarity="' + r + '">'
      + '<div class="rate-rarity-header ' + r + '">'
      + '<div class="ri-name"><span class="ri-icon ' + r + '">' + info.icon + '</span> ' + info.label + '</div>'
      + '<div class="ri-pct">' + RARITY_RATES[r] + '%</div>'
      + '<span class="rate-arrow">▼</span>'
      + '</div>'
      + '<div class="rate-rarity-content">' + flowersHTML + '</div>'
      + '</div>';
  }).join('');

  const popupHTML =
    '<div class="rate-popup-backdrop" id="ratePopup">'
    + '<div class="rate-popup">'
    + '<div class="rate-popup-head"><h3>📊 Peluang Gacha</h3>'
    + '<button class="rate-popup-close" id="rateClose">✕</button></div>'
    + '<div class="rate-popup-note" style="margin-top:0;margin-bottom:16px">'
    + 'Klik panah pada rarity untuk melihat peluang bunganya.</div>'
    + '<div class="rate-list">' + rarityGroups + '</div>'
    + '</div>'
    + '</div>';

  document.body.insertAdjacentHTML('beforeend', popupHTML);
  const popup = document.getElementById('ratePopup');
  requestAnimationFrame(() => popup.classList.add('open'));

  document.getElementById('rateClose').addEventListener('click', closeRatePopup);
  popup.addEventListener('click', e => { if (e.target.id === 'ratePopup') closeRatePopup(); });

  popup.querySelectorAll('.rate-rarity-header').forEach(header => {
    header.addEventListener('click', () => {
      header.parentElement.classList.toggle('open');
    });
  });

  popup.querySelectorAll('.rate-item[data-flower-name]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const name = el.dataset.flowerName;
      const flower = FLOWER_TYPES.find(f => f.name === name);
      if (flower) openFlowerDetail(flower);
    });
  });
}

function closeRatePopup() {
  const popup = document.getElementById('ratePopup');
  if (!popup) return;
  popup.classList.remove('open');
  setTimeout(() => popup.remove(), 250);
}

async function loadSeeds(userId) {
  const { data, error } = await supabase.from('seeds').select('*')
    .eq('user_id', userId).order('created_at', { ascending: true });
  if (error) { console.error(error); return []; }
  return data || [];
}

window.openSeedGacha = openSeedGacha;
window.resetToSeed = resetToSeed;
window.closeGachaAndReload = closeGachaAndReload;

/* 🌙 Logika Toggle Siang/Malam */
function initThemeToggle() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  
  // Cek apakah user sebelumnya sudah memilih mode malam
  const isNight = localStorage.getItem('gardenNightMode') === 'true';
  if (isNight) {
    document.body.classList.add('night-mode');
    btn.textContent = '🌙';
  }

  btn.addEventListener('click', () => {
    document.body.classList.toggle('night-mode');
    const night = document.body.classList.contains('night-mode');
    localStorage.setItem('gardenNightMode', night);
    btn.textContent = night ? '🌙' : '☀️';
    
    // Ubah kupu-kupu/lebah menjadi kunang-kunang saat malam
       const insects = document.querySelectorAll('.flying-insect');
    insects.forEach(insect => {
      if (night) {
        if (insect.classList.contains('butterfly-1') || insect.classList.contains('butterfly-2') || insect.classList.contains('butterfly-3') || insect.classList.contains('butterfly-4')) {
          insect.textContent = '✨'; // Kunang-kunang
        } else {
          insect.textContent = '🌟'; // Kunang-kunang kecil
        }
      } else {
        if (insect.classList.contains('butterfly-1') || insect.classList.contains('butterfly-2')) {
          insect.textContent = '🦋'; // Kembali jadi kupu-kupu
        } else {
          insect.textContent = '🐝'; // Kembali jadi lebah
        }
      }
    });
  });
}
  async function boot() {
  const root = document.getElementById('garden-root');
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      root.innerHTML = '<div class="state-box"><h1>🌸 Belum Masuk</h1>'
        + '<p>Silakan login dulu di halaman utama untuk melihat tamanmu.</p>'
        + '<a class="btn btn-primary" href="index.html">Buka Halaman Utama</a></div>';
      return;
    }
    
    const { data: books, error: errBooks } = await supabase.from('books').select('*')
      .eq('user_id', session.user.id).order('created_at', { ascending: false });
    if (errBooks) throw errBooks;
    
    const allSeeds = await loadSeeds(session.user.id);
    renderGarden(books || [], allSeeds);
    
         initThemeToggle();
  } catch (err) {
    console.error(err);
    root.innerHTML = '<div class="state-box"><h1>⚠️ Gagal Memuat</h1>'
      + '<p>' + esc(err.message || 'Terjadi kesalahan') + '</p>'
      + '<a class="btn btn-ghost" href="index.html">← Kembali</a></div>';
  }
}

boot();
