<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Reading Archive</title>
<meta name="theme-color" content="#292638">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#E9B44C; --amber:#D98245; --peach:#F4BFA8; --rose:#B86F78;
  --purple:#625477; --ink:#292638; --cream:#FFF4E6;
  --surface:rgba(255,244,230,.06);
  --surface-2:rgba(255,244,230,.10);
  --border:rgba(255,244,230,.14);
  --muted:rgba(255,244,230,.62);
  --radius:16px;
  --shadow:0 18px 44px -20px rgba(0,0,0,.8);
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--cream);background:#292638;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(233,180,76,.30), transparent 62%),
    radial-gradient(820px 520px at 6% -8%, rgba(244,191,168,.16), transparent 60%),
    radial-gradient(900px 620px at 94% 16%, rgba(184,111,120,.18), transparent 62%),
    radial-gradient(1200px 800px at 50% 118%, rgba(98,84,119,.45), transparent 65%),
    linear-gradient(180deg,#221f2e 0%,#2b2739 45%,#241f30 100%);
}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(41,38,56,.92),rgba(41,38,56,.62));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.topbar-inner{display:flex;align-items:center;gap:18px;height:66px;max-width:1180px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);
  font-size:1.16rem;font-weight:600;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%,#FFF4E6,var(--gold) 45%,var(--amber) 75%,var(--rose));
  box-shadow:0 0 18px rgba(233,180,76,.6)}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;font-size:.82rem;padding:8px 11px;border-radius:10px;
  transition:.2s;white-space:nowrap}
.nav a:hover{color:var(--cream);background:var(--surface)}
.nav a.active{color:var(--gold);background:rgba(233,180,76,.12)}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:12px;padding:10px 16px;
  font-size:.87rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:.2s;text-decoration:none;line-height:1.2}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--amber));color:#2a1f14;
  box-shadow:0 10px 26px -12px rgba(233,180,76,.8)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 32px -12px rgba(233,180,76,.95)}
.btn-ghost{background:var(--surface);color:var(--cream);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:rgba(184,111,120,.18);color:#f2c9cd;border-color:rgba(184,111,120,.5)}
.btn-danger:hover{background:rgba(184,111,120,.3)}
.btn-sm{padding:8px 13px;font-size:.8rem}
.icon-btn{background:transparent;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;
  width:34px;height:34px;border-radius:10px;transition:.2s}
.icon-btn:hover{background:var(--surface);color:var(--cream)}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:26px;overflow:hidden;margin:26px 0 26px;
  border:1px solid var(--border);box-shadow:var(--shadow);min-height:360px;display:flex;align-items:flex-end}
.hero-sky{position:absolute;inset:0}
.hero-sky svg{width:100%;height:100%;display:block}
.hero-content{position:relative;padding:40px 36px 38px;width:100%;
  background:linear-gradient(0deg,rgba(24,21,34,.86) 0%,rgba(24,21,34,.55) 45%,transparent 100%)}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  margin:0 0 10px;font-weight:500}
.hero h1{font-size:clamp(2.1rem,6vw,3.5rem);line-height:1.05;margin:0 0 8px;
  text-shadow:0 4px 30px rgba(0,0,0,.5)}
.tagline{font-family:var(--font-display);font-style:italic;font-size:clamp(1rem,2.4vw,1.28rem);
  color:var(--peach);margin:0 0 22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- sections ---------- */
.section{margin:34px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px}
.section-head h2{font-size:1.45rem}
.section-head a{color:var(--gold);text-decoration:none;font-size:.82rem;opacity:.9}
.section-head a:hover{opacity:1;text-decoration:underline}

/* ---------- stats ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat-card{background:linear-gradient(160deg,rgba(255,244,230,.085),rgba(255,244,230,.025));
  border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,180,76,.22),transparent 70%)}
.stat-icon{font-size:1.1rem;opacity:.85}
.stat-num{font-family:var(--font-display);font-size:2.3rem;line-height:1;margin:8px 0 4px;color:var(--gold)}
.stat-label{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- book grid ---------- */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 18px}
.book-card{cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.book-card:hover{transform:translateY(-6px)}
.cover{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;
  border:1px solid var(--border);background:#332e45;
  box-shadow:0 14px 30px -16px rgba(0,0,0,.9);transition:box-shadow .28s}
.book-card:hover .cover{box-shadow:0 22px 42px -16px rgba(233,180,76,.4)}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.book-card:hover .cover img{transform:scale(1.045)}
.badge{position:absolute;left:8px;bottom:8px;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 8px;border-radius:8px;backdrop-filter:blur(8px);font-weight:500}
.b-want{background:rgba(98,84,119,.85);color:#e8dff2}
.b-reading{background:rgba(217,130,69,.88);color:#2a1a0d}
.b-finished{background:rgba(233,180,76,.9);color:#2a1f14}
.fav-btn{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;border:none;
  background:rgba(24,21,34,.6);backdrop-filter:blur(8px);color:rgba(255,244,230,.6);
  font-size:.95rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.fav-btn:hover{background:rgba(24,21,34,.85);color:var(--gold)}
.fav-btn.on{color:var(--gold);text-shadow:0 0 12px rgba(233,180,76,.8)}
.book-title{font-size:.92rem;margin:11px 0 3px;line-height:1.3;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-author{font-size:.76rem;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--gold);font-size:.78rem;letter-spacing:.08em;margin-top:5px}
.stars.big{font-size:1.15rem}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 8px}
.toolbar .grow{flex:1 1 220px;min-width:180px}
select,input,textarea{font:inherit;font-size:.88rem;color:var(--cream);background:rgba(255,244,230,.06);
  border:1px solid var(--border);border-radius:11px;padding:10px 12px;outline:none;width:100%;transition:.2s}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}
select option{background:#2b2739;color:var(--cream)}
input:focus,select:focus,textarea:focus{border-color:rgba(233,180,76,.6);
  box-shadow:0 0 0 3px rgba(233,180,76,.13)}
input::placeholder,textarea::placeholder{color:rgba(255,244,230,.35)}
textarea{resize:vertical;min-height:92px;line-height:1.6}
.result-count{font-size:.78rem;color:var(--muted);margin:6px 0 18px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:52px 20px;border:1px dashed var(--border);border-radius:var(--radius);
  background:rgba(255,244,230,.025)}
.empty-icon{font-size:2rem;margin-bottom:10px;opacity:.85}
.empty h3{font-size:1.2rem;margin-bottom:6px}
.empty p{color:var(--muted);font-size:.87rem;margin:0 0 16px}

/* ---------- detail ---------- */
.back-link{display:inline-block;color:var(--muted);text-decoration:none;font-size:.84rem;margin:24px 0 18px}
.back-link:hover{color:var(--gold)}
.detail{display:grid;grid-template-columns:270px 1fr;gap:34px;align-items:start}
.detail-cover{border-radius:16px;overflow:hidden;border:1px solid var(--border);
  box-shadow:var(--shadow);aspect-ratio:2/3;background:#332e45}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-info h1{font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1.1;margin:12px 0 6px}
.detail-author{font-family:var(--font-display);font-style:italic;color:var(--peach);
  font-size:1.05rem;margin:0 0 12px}
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;
  margin:22px 0;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.detail-meta div span{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px}
.detail-meta div strong{font-weight:500;font-size:.9rem}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prose{color:rgba(255,244,230,.86);line-height:1.85;font-size:.93rem;white-space:pre-wrap;
  font-family:var(--font-display);font-size:1.02rem}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:8px;height:210px;padding:16px 4px 0;
  border-bottom:1px solid var(--border)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  height:100%;gap:6px;min-width:0}
.bar{width:100%;max-width:44px;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--gold),var(--amber));
  box-shadow:0 0 22px -6px rgba(233,180,76,.6);transition:height .5s cubic-bezier(.2,.7,.3,1)}
.bar-val{font-size:.7rem;color:var(--gold);font-weight:600;height:14px}
.bar-label{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.genre-row{margin-bottom:14px}
.genre-row .gr-top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
.genre-row .gr-top span:last-child{color:var(--muted);font-size:.78rem}
.gr-bar{height:7px;border-radius:5px;background:rgba(255,244,230,.09);overflow:hidden}
.gr-bar i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--rose),var(--peach),var(--gold))}
.history-item{display:flex;justify-content:space-between;gap:14px;padding:14px 0;
  border-bottom:1px solid rgba(255,244,230,.08);align-items:center}
.history-item:last-child{border-bottom:none}
.history-item h4{margin:0 0 3px;font-family:var(--font-display);font-size:1.05rem;font-weight:600}
.history-item p{margin:0;font-size:.78rem;color:var(--muted)}
.history-date{font-size:.76rem;color:var(--muted);white-space:nowrap;text-align:right}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(16,14,24,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{width:100%;max-width:660px;border-radius:20px;padding:24px;
  background:linear-gradient(165deg,#342f47,#262233 70%);
  border:1px solid var(--border);box-shadow:0 40px 90px -30px #000;
  animation:pop .25s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-head h2{font-size:1.5rem}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;
  padding-top:18px;border-top:1px solid var(--border)}
.confirm-text{color:rgba(255,244,230,.86);line-height:1.7;font-size:.93rem;margin:0}

/* ---------- form ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.uploader{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.upload-preview{width:124px;aspect-ratio:2/3;border-radius:13px;overflow:hidden;flex:0 0 auto;
  border:1px dashed var(--border);background:rgba(255,244,230,.04);display:flex;
  align-items:center;justify-content:center}
.upload-preview img{width:100%;height:100%;object-fit:cover}
.upload-actions{display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:180px}
.upload-actions .row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.72rem;color:var(--muted);margin:2px 0 0}
.star-input{display:flex;gap:6px}
.star-input button{background:none;border:none;font-size:1.5rem;color:rgba(255,244,230,.25);
  cursor:pointer;padding:0 2px;transition:.15s;line-height:1}
.star-input button.on{color:var(--gold);text-shadow:0 0 14px rgba(233,180,76,.7)}
.check-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.check-row input{width:auto;accent-color:var(--gold);width:18px;height:18px;cursor:pointer}
.check-row label{font-size:.86rem;color:var(--cream);cursor:pointer}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:200;
  padding:13px 20px;border-radius:13px;font-size:.86rem;max-width:88vw;text-align:center;
  background:linear-gradient(160deg,#3a3450,#2a2537);border:1px solid var(--border);
  color:var(--cream);box-shadow:0 24px 50px -20px #000;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(184,111,120,.7);background:linear-gradient(160deg,#4a2c36,#33202a)}

/* ---------- auth ---------- */
.auth-wrap{max-width:420px;margin:9vh auto 0;padding:32px;border-radius:22px;
  background:linear-gradient(165deg,rgba(255,244,230,.09),rgba(255,244,230,.03));
  border:1px solid var(--border);box-shadow:var(--shadow)}
.auth-wrap h1{font-size:1.9rem;margin-bottom:6px}
.auth-wrap p.sub{color:var(--muted);font-size:.88rem;margin:0 0 22px;line-height:1.6}

/* ---------- bottom nav / fab ---------- */
.bottom-nav{display:none}
.fab{display:none}
@media (max-width:860px){
  .nav{display:none}
  .brand{font-size:1.02rem}
  .topbar-inner{height:58px;gap:10px}
  body{padding-bottom:84px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(33,29,45,.96);backdrop-filter:blur(18px);
    border-top:1px solid var(--border);padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    overflow-x:auto;gap:2px;scrollbar-width:none}
  .bottom-nav::-webkit-scrollbar{display:none}
  .bottom-nav a{flex:1 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:6px 4px;font-size:.6rem;color:var(--muted);text-decoration:none;border-radius:11px;
    transition:.2s;text-align:center;line-height:1.2}
  .bottom-nav a .ic{font-size:1.05rem}
  .bottom-nav a.active{color:var(--gold);background:rgba(233,180,76,.1)}
  .fab{display:flex;position:fixed;right:18px;bottom:96px;z-index:70;width:56px;height:56px;
    border-radius:50%;border:none;align-items:center;justify-content:center;font-size:1.7rem;
    background:linear-gradient(135deg,var(--gold),var(--amber));color:#2a1f14;cursor:pointer;
    box-shadow:0 16px 34px -10px rgba(233,180,76,.85)}
  .detail{grid-template-columns:1fr;gap:22px}
  .detail-cover{max-width:220px;margin:0 auto}
  .grid-2{grid-template-columns:1fr}
  .hero-content{padding:28px 22px 26px}
  .hero{min-height:320px;border-radius:20px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:16px 12px}
  .modal{padding:20px;border-radius:16px}
  .modal-backdrop{padding:14px 10px}
}
@media (max-width:380px){
  .book-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home"><span class="brand-mark"></span> My Reading Archive</a>
    <nav class="nav" id="mainNav"></nav>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" data-action="add-book" id="addBtn">+ Tambah Buku</button>
      <button class="icon-btn" id="signOutBtn" title="Keluar" style="display:none">⏻</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="bottom-nav" id="bottomNav"></nav>
<button class="fab" data-action="add-book" aria-label="Tambahkan Buku">+</button>

<div id="modal-root"></div>

<script type="module">
/* =========================================================================
   KONFIGURASI SUPABASE
   Isi dua nilai di bawah dengan milik proyek Supabase Anda.
   Jika dibiarkan kosong, aplikasi berjalan dalam Mode Lokal (IndexedDB)
   sehingga tetap berfungsi penuh di satu perangkat.
   ========================================================================= */
const CFG = {
  SUPABASE_URL: '',        // contoh: 'https://abcdefgh.supabase.co'
  SUPABASE_ANON_KEY: '',   // contoh: 'eyJhbGciOiJIUzI1NiIsInR5cCI6...'
  BUCKET: 'covers'
};

const CLOUD = /^https?:\/\/.+/.test(CFG.SUPABASE_URL) && CFG.SUPABASE_ANON_KEY.length > 30;

let supabase = null;
if (CLOUD) {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  supabase = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
}

/* ============================ UTIL ============================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const extOf = f => {
  const m = /\.([a-z0-9]+)$/i.exec(f.name || '');
  if (m) return m[1].toLowerCase();
  return ({ 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp' }[f.type] || 'jpg');
};
const STATUS = { want:'Ingin Dibaca', reading:'Sedang Dibaca', finished:'Selesai Dibaca' };
const STATUS_CLASS = { want:'b-want', reading:'b-reading', finished:'b-finished' };

function parseDate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const fmtDate = s => { const d = parseDate(s); return d ? d.toLocaleDateString('id-ID',
  { day:'numeric', month:'long', year:'numeric' }) : '—'; };

function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 3400);
}

/* Placeholder cover bertema golden hour (SVG data-URI, tanpa koneksi internet) */

/* ====================== INDEXEDDB (MODE LOKAL) ====================== */
let _db = null;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const req = indexedDB.open('my-reading-archive', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath:'id' });
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
    };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}
function idbReq(store, mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const r = fn(d.transaction(store, mode).objectStore(store));
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
const idbAll = s => idbReq(s, 'readonly', os => os.getAll());
const idbGet = (s, k) => idbReq(s, 'readonly', os => os.get(k));
const idbPut = (s, v, k) => idbReq(s, 'readwrite', os => (k === undefined ? os.put(v) : os.put(v, k)));
const idbDel = (s, k) => idbReq(s, 'readwrite', os => os.delete(k));

/* ============================ STORE ============================ */
const Store = {
  books: [],
  userId: null,
  urls: new Map(),          // cover_path -> objectURL (mode lokal)

  async load() {
    if (CLOUD) {
      const { data: { user } } = await supabase.auth.getUser();
      this.userId = user?.id ?? null;
      if (!this.userId) { this.books = []; return; }
      const { data, error } = await supabase.from('books').select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      this.books = data || [];
    } else {
      this.books = (await idbAll('books'))
        .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
      for (const b of this.books) {
        if (b.cover_path && !this.urls.has(b.cover_path)) {
          const blob = await idbGet('files', b.cover_path);
          if (blob) this.urls.set(b.cover_path, URL.createObjectURL(blob));
        }
      }
    }
  },

  coverSrc(b) {
    if (b.cover_url) return b.cover_url;
    if (b.cover_path && this.urls.has(b.cover_path)) return this.urls.get(b.cover_path);
    return placeholderCover(b);
  },

  /* values = metadata; file = File baru (opsional); removeCover = hapus cover */
  async save({ id = null, values, file = null, removeCover = false }) {
    if (CLOUD) {
      const uidCur = this.userId;
      let cover_path = values.cover_path || null;
      let cover_url  = values.cover_url  || null;
      const oldPath = cover_path;

      if (file) {
        const path = `${uidCur}/${uid()}.${extOf(file)}`;
        const up = await supabase.storage.from(CFG.BUCKET).upload(path, file, {
          contentType: file.type || 'image/jpeg',
          cacheControl: '31536000',
          upsert: false
        });
        if (up.error) throw new Error('Upload cover gagal: ' + up.error.message);
        cover_path = path;
        cover_url = supabase.storage.from(CFG.BUCKET).getPublicUrl(path).data.publicUrl;
      } else if (removeCover) {
        cover_path = null; cover_url = null;
      }

      const row = { ...values, cover_path, cover_url };
      delete row.id; delete row.created_at; delete row.user_id;

      let saved;
      if (id) {
        const { data, error } = await supabase.from('books').update(row).eq('id', id).select().single();
        if (error) throw new Error(error.message);
        saved = data;
      } else {
        const { data, error } = await supabase.from('books')
          .insert({ ...row, user_id: uidCur }).select().single();
        if (error) throw new Error(error.message);
        saved = data;
      }
      if (oldPath && oldPath !== cover_path) {
        await supabase.storage.from(CFG.BUCKET).remove([oldPath]);
      }
      return saved;
    }

    /* ----- mode lokal ----- */
    const now = new Date().toISOString();
    const existing = id ? this.books.find(b => b.id === id) : null;
    let cover_path = values.cover_path || null;

    if (file) {
      const path = `local/${uid()}.${extOf(file)}`;
      await idbPut('files', file, path);
      if (cover_path && this.urls.has(cover_path)) {
        URL.revokeObjectURL(this.urls.get(cover_path));
        this.urls.delete(cover_path);
      }
      cover_path = path;
      this.urls.set(path, URL.createObjectURL(file));
    } else if (removeCover) {
      if (cover_path) {
        await idbDel('files', cover_path).catch(() => {});
        if (this.urls.has(cover_path)) {
          URL.revokeObjectURL(this.urls.get(cover_path));
          this.urls.delete(cover_path);
        }
      }
      cover_path = null;
    }

    const book = {
      ...values,
      id: id || uid(),
      cover_path,
      cover_url: null,
      created_at: existing?.created_at || now,
      updated_at: now
    };
    await idbPut('books', book);
    return book;
  },

  async remove(book) {
    if (CLOUD) {
      if (book.cover_path) await supabase.storage.from(CFG.BUCKET).remove([book.cover_path]);
      const { error } = await supabase.from('books').delete().eq('id', book.id);
      if (error) throw new Error(error.message);
    } else {
      if (book.cover_path) {
        await idbDel('files', book.cover_path).catch(() => {});
        if (this.urls.has(book.cover_path)) {
          URL.revokeObjectURL(this.urls.get(book.cover_path));
          this.urls.delete(book.cover_path);
        }
      }
      await idbDel('books', book.id);
    }
  }
};

let currentPreset = { key: 'collection' };

const SORTERS = {
  added:  (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')),
  title:  (a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'id'),
  author: (a, b) => String(a.author || '').localeCompare(String(b.author || ''), 'id'),
  rating: (a, b) => (b.rating || 0) - (a.rating || 0)
};

function computeList() {
  const f = state.filters;
  let list = Store.books.slice();

  if (currentPreset.status) list = list.filter(b => b.status === currentPreset.status);
  if (currentPreset.favoritesOnly) list = list.filter(b => b.favorite);
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter(b =>
      String(b.title || '').toLowerCase().includes(q) ||
      String(b.author || '').toLowerCase().includes(q));
  }
  if (f.genre) list = list.filter(b => (b.genre || '') === f.genre);
  if (f.status && !currentPreset.status) list = list.filter(b => b.status === f.status);

  list.sort(SORTERS[f.sort] || SORTERS.added);
  return list;
}

function viewStats() {
  const books = Store.books;
  const finished = books.filter(b => b.status === 'finished');
  const rated = books.filter(b => b.rating > 0);
  const avg = rated.length
    ? (rated.reduce((s, b) => s + Number(b.rating), 0) / rated.length) : 0;

  const now = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({
      key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
      label: d.toLocaleDateString('id-ID', { month: 'short' }),
      count: 0
    });
  }
  finished.forEach(b => {
    const d = parseDate(b.date_finished || b.updated_at || b.created_at);
    if (!d) return;
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const m = months.find(x => x.key === key);
    if (m) m.count++;
  });
  const maxMonth = Math.max(1, ...months.map(m => m.count));

  const genreCount = {};
  books.forEach(b => { if (b.genre) genreCount[b.genre] = (genreCount[b.genre] || 0) + 1; });
  const topGenres = Object.entries(genreCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxGenre = Math.max(1, ...topGenres.map(g => g[1]));

  const history = finished.slice().sort((a, b) =>
    String(b.date_finished || b.updated_at || '').localeCompare(String(a.date_finished || a.updated_at || '')));

  const card = (icon, num, label) => `
    <div class="stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-num">${num}</div>
      <div class="stat-label">${label}</div>
    </div>`;

  return `
  <div class="section" style="margin-top:28px">
    <div class="section-head" style="margin-bottom:4px"><h2 style="font-size:1.9rem">Reading Statistics</h2></div>
    <p style="color:var(--muted);font-size:.88rem;margin:0">Dihitung otomatis dari data arsipmu.</p>
  </div>

  <section class="stats-grid">
    ${card('📚', books.length, 'Total Buku')}
    ${card('✅', finished.length, 'Selesai Dibaca')}
    ${card('⭐', avg ? avg.toFixed(1) : '—', 'Rata-rata Rating')}
    ${card('🎭', topGenres.length ? topGenres[0][0] : '—', 'Genre Terfavorit')}
  </section>

  <section class="section">
    <div class="section-head"><h2>Buku Selesai per Bulan</h2></div>
    <div class="chart">
      ${months.map(m => `
        <div class="bar-col">
          <span class="bar-val">${m.count || ''}</span>
          <div class="bar" style="height:${Math.max(3, (m.count / maxMonth) * 100)}%"></div>
          <span class="bar-label">${m.label}</span>
        </div>`).join('')}
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Genre yang Paling Sering Dibaca</h2></div>
    ${topGenres.length ? topGenres.map(([g, n]) => `
      <div class="genre-row">
        <div class="gr-top"><span>${esc(g)}</span><span>${n} buku</span></div>
        <div class="gr-bar"><i style="width:${(n / maxGenre) * 100}%"></i></div>
      </div>`).join('')
      : `<p style="color:var(--muted);font-size:.88rem">Belum ada data genre.</p>`}
  </section>

  <section class="section">
    <div class="section-head"><h2>Riwayat Membaca</h2></div>
    ${history.length ? history.map(b => `
      <div class="history-item">
        <div style="min-width:0">
          <h4><a href="#/book/${b.id}" style="text-decoration:none">${esc(b.title)}</a></h4>
          <p>${esc(b.author || 'Tanpa penulis')}${b.rating ? ' · ' + '★'.repeat(b.rating) : ''}</p>
        </div>
        <div class="history-date">${fmtDate(b.date_finished || b.updated_at)}</div>
      </div>`).join('')
      : emptyState('Belum ada riwayat', 'Tandai buku sebagai "Selesai Dibaca" untuk melihat riwayat di sini.')}
  </section>`;
}

/* ============================ MODAL ============================ */
const modalRoot = $('#modal-root');
function showModal(html) {
  modalRoot.innerHTML =
    `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  $('#backdrop').addEventListener('mousedown', e => { if (e.target.id === 'backdrop') closeModal(); });
}
function closeModal() {
  modalRoot.innerHTML = '';
  document.body.style.overflow = '';
  if (formState.previewUrl && formState.previewUrl.startsWith('blob:')) {
    URL.revokeObjectURL(formState.previewUrl);
  }
  formState = { file:null, removeCover:false, rating:0, previewUrl:null, id:null, existing:null };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============================ FORM BUKU ============================ */
let formState = { file:null, removeCover:false, rating:0, previewUrl:null, id:null, existing:null };

function openBookForm(book) {
  const isEdit = !!book;
  const b = book || { status:'want', rating:0, favorite:false, title:'' };
  const genres = [...new Set(Store.books.map(x => x.genre).filter(Boolean))].sort();

  formState = {
    file: null,
    removeCover: false,
    rating: Number(b.rating) || 0,
    previewUrl: isEdit ? Store.coverSrc(b) : placeholderCover({ title:'Buku Baru' }),
    id: book?.id || null,
    existing: book || null
  };

  showModal(`
    <div class="modal-head">
      <h2>${isEdit ? 'Edit Buku' : 'Tambahkan Buku'}</h2>
      <button class="icon-btn" data-action="close-modal" aria-label="Tutup">✕</button>
    </div>

    <form id="bookForm" novalidate>
      <div class="uploader">
        <div class="upload-preview"><img id="previewImg" src="${formState.previewUrl}" alt="Preview cover"></div>
        <div class="upload-actions">
          <div class="row">
            <button type="button" class="btn btn-ghost btn-sm" id="pickBtn">Pilih Foto</button>
            <button type="button" class="btn btn-ghost btn-sm" id="camBtn">Kamera</button>
          </div>
          <div class="row">
            <button type="button" class="btn btn-ghost btn-sm" id="phBtn">Pakai Placeholder</button>
            <button type="button" class="btn btn-danger btn-sm" id="rmBtn">Hapus Foto</button>
          </div>
          <p class="hint">JPG, JPEG, PNG, atau WebP · maksimal 50 MB. Foto tersimpan permanen di arsip.</p>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp" hidden>
        <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
      </div>

      <div class="field">
        <label for="f_title">Judul Buku *</label>
        <input id="f_title" type="text" required placeholder="Contoh: Laskar Pelangi" value="${esc(b.title || '')}">
      </div>

      <div class="grid-2">
        <div class="field"><label for="f_author">Penulis</label>
          <input id="f_author" type="text" placeholder="Nama penulis" value="${esc(b.author || '')}"></div>
        <div class="field"><label for="f_genre">Genre</label>
          <input id="f_genre" type="text" list="genreList" placeholder="Fiksi, Sejarah, dll."
            value="${esc(b.genre || '')}">
          <datalist id="genreList">${genres.map(g => `<option value="${esc(g)}">`).join('')}</datalist>
        </div>
      </div>

      <div class="grid-2">
        <div class="field"><label for="f_publisher">Penerbit</label>
          <input id="f_publisher" type="text" placeholder="Nama penerbit" value="${esc(b.publisher || '')}"></div>
        <div class="field"><label for="f_year">Tahun Terbit</label>
          <input id="f_year" type="text" inputmode="numeric" placeholder="2024" value="${esc(b.year || '')}"></div>
      </div>

      <div class="grid-2">
        <div class="field"><label for="f_isbn">ISBN</label>
          <input id="f_isbn" type="text" placeholder="978-…" value="${esc(b.isbn || '')}"></div>
        <div class="field"><label for="f_status">Status Membaca</label>
          <select id="f_status">
            <option value="want"     ${b.status === 'want' ? 'selected' : ''}>Ingin Dibaca</option>
            <option value="reading"  ${b.status === 'reading' ? 'selected' : ''}>Sedang Dibaca</option>
            <option value="finished" ${b.status === 'finished' ? 'selected' : ''}>Selesai Dibaca</option>
          </select></div>
      </div>

      <div class="grid-2">
        <div class="field"><label for="f_start">Tanggal Mulai Membaca</label>
          <input id="f_start" type="date" value="${b.date_started || ''}"></div>
        <div class="field"><label for="f_finish">Tanggal Selesai Membaca</label>
          <input id="f_finish" type="date" value="${b.date_finished || ''}"></div>
      </div>

      <div class="field">
        <label>Rating Pribadi</label>
        <div class="star-input" id="starInput">
          ${[1,2,3,4,5].map(n =>
            `<button type="button" data-star="${n}" class="${formState.rating >= n ? 'on' : ''}"
              aria-label="${n} bintang">★</button>`).join('')}
        </div>
      </div>

      <div class="field"><label for="f_synopsis">Sinopsis</label>
        <textarea id="f_synopsis" placeholder="Ringkasan cerita…">${esc(b.synopsis || '')}</textarea></div>

      <div class="field"><label for="f_notes">Catatan Pribadi / Ulasan</label>
        <textarea id="f_notes" placeholder="Kesan, kutipan favorit, atau pemikiranmu…">${esc(b.notes || '')}</textarea></div>

      <div class="check-row">
        <input type="checkbox" id="f_fav" ${b.favorite ? 'checked' : ''}>
        <label for="f_fav">Tandai sebagai favorit ★</label>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="close-modal">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Buku</button>
      </div>
    </form>
  `);

  /* --- Upload handlers --- */
  const fileInput = $('#fileInput');
  const camInput  = $('#camInput');
  const previewImg = $('#previewImg');

  const setPreview = src => { previewImg.src = src; };

  function handleFile(file) {
    if (!file) return;
    const okType = ['image/jpeg','image/jpg','image/png','image/webp'].includes(file.type)
      || /\.(jpe?g|png|webp)$/i.test(file.name);
    if (!okType) { toast('Format harus JPG, JPEG, PNG, atau WebP', 'err'); return; }
    if (file.size > 50 * 1024 * 1024) { toast('Ukuran foto maksimal 50 MB', 'err'); return; }

    if (formState.previewUrl && formState.previewUrl.startsWith('blob:')) {
      URL.revokeObjectURL(formState.previewUrl);
    }
    formState.file = file;
    formState.removeCover = false;
    formState.previewUrl = URL.createObjectURL(file);
    setPreview(formState.previewUrl);
  }

  $('#pickBtn').addEventListener('click', () => fileInput.click());
  $('#camBtn').addEventListener('click', () => camInput.click());
  fileInput.addEventListener('change', () => { handleFile(fileInput.files[0]); fileInput.value = ''; });
  camInput.addEventListener('change', () => { handleFile(camInput.files[0]); camInput.value = ''; });

  $('#rmBtn').addEventListener('click', () => {
    if (formState.previewUrl && formState.previewUrl.startsWith('blob:')) {
      URL.revokeObjectURL(formState.previewUrl);
    }
    formState.file = null;
    formState.removeCover = true;
    formState.previewUrl = placeholderCover({ title: $('#f_title').value || 'Buku Baru' });
    setPreview(formState.previewUrl);
  });

  $('#phBtn').addEventListener('click', () => $('#rmBtn').click());

  /* --- Rating --- */
  $('#starInput').addEventListener('click', e => {
    const btn = e.target.closest('[data-star]');
    if (!btn) return;
    const val = Number(btn.dataset.star);
    formState.rating = (formState.rating === val) ? 0 : val;
    $$('#starInput button').forEach(x =>
      x.classList.toggle('on', Number(x.dataset.star) <= formState.rating));
  });

  /* --- Submit --- */
  $('#bookForm').addEventListener('submit', async e => {
    e.preventDefault();
    const title = $('#f_title').value.trim();
    if (!title) { toast('Judul buku wajib diisi', 'err'); $('#f_title').focus(); return; }

    const values = {
      title,
      author: $('#f_author').value.trim() || null,
      genre: $('#f_genre').value.trim() || null,
      publisher: $('#f_publisher').value.trim() || null,
      year: $('#f_year').value.trim() || null,
      isbn: $('#f_isbn').value.trim() || null,
      status: $('#f_status').value,
      date_started: $('#f_start').value || null,
      date_finished: $('#f_finish').value || null,
      rating: formState.rating || null,
      synopsis: $('#f_synopsis').value.trim() || null,
      notes: $('#f_notes').value.trim() || null,
      favorite: $('#f_fav').checked,
      cover_path: formState.existing?.cover_path || null,
      cover_url: formState.existing?.cover_url || null
    };

    const saveBtn = $('#saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Menyimpan…';

    try {
      await Store.save({
        id: formState.id,
        values,
        file: formState.file,
        removeCover: formState.removeCover
      });
      await Store.load();
      closeModal();
      render(false);
      toast(isEdit ? 'Buku berhasil diperbarui' : 'Buku berhasil ditambahkan');
    } catch (err) {
      console.error(err);
      saveBtn.disabled = false;
      saveBtn.textContent = 'Simpan Buku';
      toast('Gagal menyimpan: ' + (err.message || err), 'err');
    }
  });
}

/* ============================ AKSI ============================ */
async function toggleFav(id) {
  const b = Store.books.find(x => x.id === id);
  if (!b) return;
  const prev = !!b.favorite;
  b.favorite = !prev;
  softRefresh();
  try {
    await Store.save({ id, values: bookValues(b) });
    await Store.load();
    softRefresh();
    toast(b.favorite ? 'Ditandai sebagai favorit' : 'Dihapus dari favorit');
  } catch (err) {
    await Store.load();
    softRefresh();
    toast('Gagal memperbarui: ' + err.message, 'err');
  }
}

function confirmDelete(id) {
  const b = Store.books.find(x => x.id === id);
  if (!b) return;
  showModal(`
    <div class="modal-head"><h2>Hapus Buku</h2>
      <button class="icon-btn" data-action="close-modal">✕</button></div>
    <p class="confirm-text">Yakin ingin menghapus <strong>${esc(b.title)}</strong> dari arsip?
      Foto cover dan seluruh datanya akan ikut terhapus permanen.</p>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal">Batal</button>
      <button class="btn btn-danger" id="confirmDel">Hapus Buku</button>
    </div>`);

  $('#confirmDel').addEventListener('click', async () => {
    const btn = $('#confirmDel');
    btn.disabled = true;
    btn.textContent = 'Menghapus…';
    try {
      await Store.remove(b);
      await Store.load();
      closeModal();
      if (parseHash().page === 'book') location.hash = '#/collection';
      else render(false);
      toast('Buku dihapus');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Hapus Buku';
      toast('Gagal menghapus: ' + err.message, 'err');
    }
  });
}

function softRefresh() {
  if ($('#gridWrap')) refreshGrid();
  else render(false);
}

/* ============================ RENDER ============================ */
let state = { filters: { q:'', genre:'', status:'', sort:'added' } };

function render(scrollTop = true) {
  const { page, param } = parseHash();
  let html = '';

  switch (page) {
    case 'home':       html = viewHome(); break;
    case 'collection': html = viewCollection({ key:'collection' }); break;
    case 'reading':    html = viewCollection({ key:'reading', status:'reading' }); break;
    case 'want':       html = viewCollection({ key:'want', status:'want' }); break;
    case 'favorites':  html = viewCollection({ key:'favorites', favoritesOnly:true }); break;
    case 'stats':      html = viewStats(); break;
    case 'book':       html = viewBookDetail(param); break;
    default:           html = viewHome();
  }

  $('#view').innerHTML = html;
  setActiveNav(page);
  bindView();
  if (scrollTop) window.scrollTo({ top:0, behavior:'auto' });
}

function bindView() {
  const q = $('#searchInput');
  if (q) {
    q.value = state.filters.q;
    q.addEventListener('input', () => { state.filters.q = q.value; refreshGrid(); });
  }
  const g = $('#genreFilter');
  if (g) {
    g.value = state.filters.genre;
    g.addEventListener('change', () => { state.filters.genre = g.value; refreshGrid(); });
  }
  const s = $('#statusFilter');
  if (s) {
    s.value = state.filters.status;
    s.addEventListener('change', () => { state.filters.status = s.value; refreshGrid(); });
  }
  const so = $('#sortSelect');
  if (so) {
    so.value = state.filters.sort;
    so.addEventListener('change', () => { state.filters.sort = so.value; refreshGrid(); });
  }
  const ds = $('#detailStatus');
  if (ds) {
    ds.addEventListener('change', async () => {
      const b = Store.books.find(x => x.id === ds.dataset.id);
      if (!b) return;
      b.status = ds.value;
      try {
        await Store.save({ id: b.id, values: bookValues(b) });
        await Store.load();
        render(false);
        toast('Status diperbarui');
      } catch (err) {
        await Store.load();
        render(false);
        toast('Gagal memperbarui status: ' + err.message, 'err');
      }
    });
  }
}

/* ============================ EVENT DELEGATION ============================ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id } = el.dataset;

  if (action === 'add-book') {
    e.preventDefault();
    openBookForm(null);
  } else if (action === 'open-book') {
    location.hash = '#/book/' + id;
  } else if (action === 'edit-book') {
    e.preventDefault();
    const b = Store.books.find(x => x.id === id);
    if (b) openBookForm(b);
  } else if (action === 'delete-book') {
    e.preventDefault();
    confirmDelete(id);
  } else if (action === 'toggle-fav') {
    e.preventDefault();
    e.stopPropagation();
    await toggleFav(id);
  } else if (action === 'close-modal') {
    e.preventDefault();
    closeModal();
  }
});

/* ============================ AUTH (CLOUD) ============================ */
function renderAuth(message = '') {
  $('#mainNav').style.display = 'none';
  $('#addBtn').style.display = 'none';
  $('#bottomNav').style.display = 'none';
  $('.fab').style.display = 'none';
  $('#signOutBtn').style.display = 'none';

  $('#view').innerHTML = `
    <div class="auth-wrap">
      <h1>My Reading Archive</h1>
      <p class="sub">Masuk untuk membuka arsip pribadimu. Koleksi dan foto covermu
        tersimpan aman dan hanya bisa diakses oleh akunmu.</p>
      ${message ? `<p class="sub" style="color:var(--peach)">${esc(message)}</p>` : ''}
      <form id="authForm">
        <div class="field"><label for="a_email">Email</label>
          <input id="a_email" type="email" required autocomplete="email" placeholder="nama@email.com"></div>
        <div class="field"><label for="a_pass">Kata Sandi</label>
          <input id="a_pass" type="password" required minlength="6"
            autocomplete="current-password" placeholder="Minimal 6 karakter"></div>
        <div class="modal-foot" style="border:none;padding-top:6px">
          <button type="button" class="btn btn-ghost" id="signUpBtn">Daftar</button>
          <button type="submit" class="btn btn-primary" id="signInBtn">Masuk</button>
        </div>
      </form>
    </div>`;

  $('#authForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#a_email').value.trim();
    const password = $('#a_pass').value;
    $('#signInBtn').disabled = true;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    $('#signInBtn').disabled = false;
    if (error) { toast('Gagal masuk: ' + error.message, 'err'); return; }
    await boot();
  });

  $('#signUpBtn').addEventListener('click', async () => {
    const email = $('#a_email').value.trim();
    const password = $('#a_pass').value;
    if (!email || password.length < 6) {
      toast('Isi email dan kata sandi minimal 6 karakter', 'err');
      return;
    }
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) { toast('Gagal mendaftar: ' + error.message, 'err'); return; }
    if (!data.session) {
      toast('Cek email untuk konfirmasi, lalu masuk kembali.');
      return;
    }
    await boot();
  });
}

/* ============================ BOOT ============================ */
async function boot() {
  renderNav();

  if (CLOUD) {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { renderAuth(); return; }

    Store.userId = session.user.id;
    $('#mainNav').style.display = '';
    $('#addBtn').style.display = '';
    $('#bottomNav').style.display = '';
    $('.fab').style.display = '';
    $('#signOutBtn').style.display = '';

    supabase.auth.onAuthStateChange((evt) => {
      if (evt === 'SIGNED_OUT') { Store.books = []; renderAuth(); }
    });
  }

  try {
    await Store.load();
  } catch (err) {
    console.error(err);
    toast('Gagal memuat koleksi: ' + err.message, 'err');
  }

  if (!location.hash) location.hash = '#/home';
  window.addEventListener('hashchange', () => render(true));
  render(true);
}

$('#signOutBtn').addEventListener('click', async () => {
  if (!CLOUD) return;
  await supabase.auth.signOut();
  Store.books = [];
  renderAuth();
});

boot();
</script>
</body>
</html>
