<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Reading Archive · Flower Garden</title>
<meta name="theme-color" content="#3D2B3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 🌸 Palet Bunga */
  --blush:#F7CAC9;
  --rose:#E8A0BF;
  --lavender:#C8A2C8;
  --sage:#A8C09A;
  --butter:#F4E4A6;
  --coral:#F4A896;
  --plum:#3D2B3D;
  --cream:#FFF8F0;

  /* 🌿 Aksen & UI */
  --surface:rgba(255,248,240,.07);
  --surface-2:rgba(255,248,240,.12);
  --border:rgba(255,248,240,.15);
  --muted:rgba(255,248,240,.62);
  --radius:16px;
  --shadow:0 18px 44px -20px rgba(45,20,45,.75);
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--cream);background:#3D2B3D;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(244,228,166,.22), transparent 62%),
    radial-gradient(820px 520px at 6% -8%, rgba(247,202,201,.18), transparent 60%),
    radial-gradient(900px 620px at 94% 16%, rgba(232,160,191,.20), transparent 62%),
    radial-gradient(1200px 800px at 50% 118%, rgba(200,162,200,.35), transparent 65%),
    linear-gradient(180deg,#2f2030 0%,#3d2b3d 45%,#2f2030 100%);
}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.01em;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(61,43,61,.92),rgba(61,43,61,.62));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.topbar-inner{display:flex;align-items:center;gap:18px;height:66px;max-width:1180px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);
  font-size:1.16rem;font-weight:600;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:50%;flex:0 0 auto;position:relative;
  background:radial-gradient(circle at 35% 30%,#FFF8F0,var(--rose) 45%,var(--lavender) 75%,var(--coral));
  box-shadow:0 0 18px rgba(232,160,191,.6)}
.brand-mark::after{content:'🌸';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav a{color:var(--muted);text-decoration:none;font-size:.82rem;padding:8px 11px;border-radius:10px;
  transition:.2s;white-space:nowrap}
.nav a:hover{color:var(--cream);background:var(--surface)}
.nav a.active{color:var(--rose);background:rgba(232,160,191,.14)}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:12px;padding:10px 16px;
  font-size:.87rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:.2s;text-decoration:none;line-height:1.2}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--rose),var(--coral));color:#3d2030;
  box-shadow:0 10px 26px -12px rgba(232,160,191,.8)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 32px -12px rgba(232,160,191,.95)}
.btn-ghost{background:var(--surface);color:var(--cream);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:rgba(232,160,191,.18);color:#ffd9e6;border-color:rgba(232,160,191,.5)}
.btn-danger:hover{background:rgba(232,160,191,.3)}
.btn-sm{padding:8px 13px;font-size:.8rem}
.icon-btn{background:transparent;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;
  width:34px;height:34px;border-radius:10px;transition:.2s}
.icon-btn:hover{background:var(--surface);color:var(--cream)}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:26px;overflow:hidden;margin:26px 0 26px;
  border:1px solid var(--border);box-shadow:var(--shadow);min-height:360px;display:flex;align-items:flex-end}
.hero-sky{position:absolute;inset:0}
.hero-sky svg{width:100%;height:100%;display:block}
.hero-content{position:relative;padding:40px 36px 38px;width:100%;
  background:linear-gradient(0deg,rgba(45,25,45,.88) 0%,rgba(45,25,45,.55) 45%,transparent 100%)}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--butter);
  margin:0 0 10px;font-weight:500}
.hero h1{font-size:clamp(2.1rem,6vw,3.5rem);line-height:1.05;margin:0 0 8px;
  text-shadow:0 4px 30px rgba(0,0,0,.5)}
.tagline{font-family:var(--font-display);font-style:italic;font-size:clamp(1rem,2.4vw,1.28rem);
  color:var(--blush);margin:0 0 22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- sections ---------- */
.section{margin:34px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px}
.section-head h2{font-size:1.45rem}
.section-head a{color:var(--rose);text-decoration:none;font-size:.82rem;opacity:.9}
.section-head a:hover{opacity:1;text-decoration:underline}

/* ---------- stats ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat-card{background:linear-gradient(160deg,rgba(255,248,240,.09),rgba(255,248,240,.025));
  border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(247,202,201,.28),transparent 70%)}
.stat-icon{font-size:1.1rem;opacity:.9}
.stat-num{font-family:var(--font-display);font-size:2.3rem;line-height:1;margin:8px 0 4px;color:var(--rose)}
.stat-label{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- book grid ---------- */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 18px}
.book-card{cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.book-card:hover{transform:translateY(-6px)}
.cover{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;
  border:1px solid var(--border);background:#4a3348;
  box-shadow:0 14px 30px -16px rgba(45,20,45,.9);transition:box-shadow .28s}
.book-card:hover .cover{box-shadow:0 22px 42px -16px rgba(232,160,191,.5)}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.book-card:hover .cover img{transform:scale(1.045)}
.badge{position:absolute;left:8px;bottom:8px;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 8px;border-radius:8px;backdrop-filter:blur(8px);font-weight:500}
.b-want{background:rgba(200,162,200,.85);color:#3d2b3d}
.b-reading{background:rgba(244,168,150,.9);color:#3d2030}
.b-finished{background:rgba(244,228,166,.92);color:#3d2b3d}
.fav-btn{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;border:none;
  background:rgba(45,25,45,.6);backdrop-filter:blur(8px);color:rgba(255,248,240,.6);
  font-size:.95rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.fav-btn:hover{background:rgba(45,25,45,.85);color:var(--rose)}
.fav-btn.on{color:var(--rose);text-shadow:0 0 12px rgba(232,160,191,.8)}
.book-title{font-size:.92rem;margin:11px 0 3px;line-height:1.3;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-author{font-size:.76rem;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--rose);font-size:.78rem;letter-spacing:.08em;margin-top:5px}
.stars.big{font-size:1.15rem}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 8px}
.toolbar .grow{flex:1 1 220px;min-width:180px}
select,input,textarea{font:inherit;font-size:.88rem;color:var(--cream);background:rgba(255,248,240,.06);
  border:1px solid var(--border);border-radius:11px;padding:10px 12px;outline:none;width:100%;transition:.2s}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}
select option{background:#3d2b3d;color:var(--cream)}
input:focus,select:focus,textarea:focus{border-color:rgba(232,160,191,.6);
  box-shadow:0 0 0 3px rgba(232,160,191,.13)}
input::placeholder,textarea::placeholder{color:rgba(255,248,240,.35)}
textarea{resize:vertical;min-height:92px;line-height:1.6}
.result-count{font-size:.78rem;color:var(--muted);margin:6px 0 18px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:52px 20px;border:1px dashed var(--border);border-radius:var(--radius);
  background:rgba(255,248,240,.03)}
.empty-icon{font-size:2.4rem;margin-bottom:10px;opacity:.9}
.empty h3{font-size:1.2rem;margin-bottom:6px}
.empty p{color:var(--muted);font-size:.87rem;margin:0 0 16px}

/* ---------- detail ---------- */
.back-link{display:inline-block;color:var(--muted);text-decoration:none;font-size:.84rem;margin:24px 0 18px}
.back-link:hover{color:var(--rose)}
.detail{display:grid;grid-template-columns:270px 1fr;gap:34px;align-items:start}
.detail-cover{border-radius:16px;overflow:hidden;border:1px solid var(--border);
  box-shadow:var(--shadow);aspect-ratio:2/3;background:#4a3348}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-info h1{font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1.1;margin:12px 0 6px}
.detail-author{font-family:var(--font-display);font-style:italic;color:var(--blush);
  font-size:1.05rem;margin:0 0 12px}
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;
  margin:22px 0;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.detail-meta div span{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px}
.detail-meta div strong{font-weight:500;font-size:.9rem}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prose{color:rgba(255,248,240,.86);line-height:1.85;white-space:pre-wrap;
  font-family:var(--font-display);font-size:1.02rem}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:8px;height:210px;padding:16px 4px 0;
  border-bottom:1px solid var(--border)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  height:100%;gap:6px;min-width:0}
.bar{width:100%;max-width:44px;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--butter),var(--coral));
  box-shadow:0 0 22px -6px rgba(244,228,166,.6);transition:height .5s cubic-bezier(.2,.7,.3,1)}
.bar-val{font-size:.7rem;color:var(--rose);font-weight:600;height:14px}
.bar-label{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden}
.genre-row{margin-bottom:14px}
.genre-row .gr-top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
.genre-row .gr-top span:last-child{color:var(--muted);font-size:.78rem}
.gr-bar{height:7px;border-radius:5px;background:rgba(255,248,240,.09);overflow:hidden}
.gr-bar i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--sage),var(--blush),var(--rose))}
.history-item{display:flex;justify-content:space-between;gap:14px;padding:14px 0;
  border-bottom:1px solid rgba(255,248,240,.08);align-items:center}
.history-item:last-child{border-bottom:none}
.history-item h4{margin:0 0 3px;font-family:var(--font-display);font-size:1.05rem;font-weight:600}
.history-item p{margin:0;font-size:.78rem;color:var(--muted)}
.history-date{font-size:.76rem;color:var(--muted);white-space:nowrap;text-align:right}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(30,18,30,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{width:100%;max-width:660px;border-radius:20px;padding:24px;
  background:linear-gradient(165deg,#4a3348,#33202f 70%);
  border:1px solid var(--border);box-shadow:0 40px 90px -30px #000;
  animation:pop .25s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-head h2{font-size:1.5rem}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;
  padding-top:18px;border-top:1px solid var(--border)}
.confirm-text{color:rgba(255,248,240,.86);line-height:1.7;font-size:.93rem;margin:0}

/* ---------- form ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.uploader{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.upload-preview{width:124px;aspect-ratio:2/3;border-radius:13px;overflow:hidden;flex:0 0 auto;
  border:1px dashed var(--border);background:rgba(255,248,240,.04);display:flex;
  align-items:center;justify-content:center}
.upload-preview img{width:100%;height:100%;object-fit:cover}
.upload-actions{display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:180px}
.upload-actions .row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.72rem;color:var(--muted);margin:2px 0 0}
.star-input{display:flex;gap:6px}
.star-input button{background:none;border:none;font-size:1.5rem;color:rgba(255,248,240,.25);
  cursor:pointer;padding:0 2px;transition:.15s;line-height:1}
.star-input button.on{color:var(--rose);text-shadow:0 0 14px rgba(232,160,191,.7)}
.check-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.check-row input{width:auto;accent-color:var(--rose);width:18px;height:18px;cursor:pointer}
.check-row label{font-size:.86rem;color:var(--cream);cursor:pointer}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:200;
  padding:13px 20px;border-radius:13px;font-size:.86rem;max-width:88vw;text-align:center;
  background:linear-gradient(160deg,#4a3348,#33202f);border:1px solid var(--border);
  color:var(--cream);box-shadow:0 24px 50px -20px #000;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(232,160,191,.7);background:linear-gradient(160deg,#5a2c46,#3a1f30)}

/* ---------- auth ---------- */
.auth-wrap{max-width:420px;margin:9vh auto 0;padding:32px;border-radius:22px;
  background:linear-gradient(165deg,rgba(255,248,240,.10),rgba(255,248,240,.03));
  border:1px solid var(--border);box-shadow:var(--shadow)}
.auth-wrap h1{font-size:1.9rem;margin-bottom:6px}
.auth-wrap p.sub{color:var(--muted);font-size:.88rem;margin:0 0 22px;line-height:1.6}

/* ---------- bottom nav / fab ---------- */
.bottom-nav{display:none}
.fab{display:none}
@media (max-width:860px){
  .nav{display:none}
  .brand{font-size:1.02rem}
  .topbar-inner{height:58px;gap:10px}
  body{padding-bottom:84px}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(48,30,48,.96);backdrop-filter:blur(18px);
    border-top:1px solid var(--border);padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    overflow-x:auto;gap:2px;scrollbar-width:none}
  .bottom-nav::-webkit-scrollbar{display:none}
  .bottom-nav a{flex:1 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;
    gap:3px;padding:6px 4px;font-size:.6rem;color:var(--muted);text-decoration:none;border-radius:11px;
    transition:.2s;text-align:center;line-height:1.2}
  .bottom-nav a .ic{font-size:1.05rem}
  .bottom-nav a.active{color:var(--rose);background:rgba(232,160,191,.12)}
  .fab{display:flex;position:fixed;right:18px;bottom:96px;z-index:70;width:56px;height:56px;
    border-radius:50%;border:none;align-items:center;justify-content:center;font-size:1.7rem;
    background:linear-gradient(135deg,var(--rose),var(--coral));color:#3d2030;cursor:pointer;
    box-shadow:0 16px 34px -10px rgba(232,160,191,.85)}
  .detail{grid-template-columns:1fr;gap:22px}
  .detail-cover{max-width:220px;margin:0 auto}
  .grid-2{grid-template-columns:1fr}
  .hero-content{padding:28px 22px 26px}
  .hero{min-height:320px;border-radius:20px}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:16px 12px}
  .modal{padding:20px;border-radius:16px}
  .modal-backdrop{padding:14px 10px}
}
@media (max-width:380px){
  .book-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home"><span class="brand-mark"></span> My Reading Archive</a>
    <nav class="nav" id="mainNav"></nav>
    <div class="topbar-actions">
      <button class="btn btn-primary btn-sm" data-action="add-book" id="addBtn">🌸 Tambah Buku</button>
      <button class="icon-btn" id="signOutBtn" title="Keluar" style="display:none">⏻</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="bottom-nav" id="bottomNav"></nav>
<button class="fab" data-action="add-book" aria-label="Tambahkan Buku">+</button>

<div id="modal-root"></div>

const fmtDate = s => { const d = parseDate(s); return d ? d.toLocaleDateString('id-ID',
  { day:'numeric', month:'long', year:'numeric' }) : '—'; };

function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 3400);
}
